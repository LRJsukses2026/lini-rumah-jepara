<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>Lini Rumah Jepara</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --serif:"Cormorant Garamond","Iowan Old Style","Palatino Linotype",Georgia,serif;
  --sans:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --wa:#25D366;
}
:root,[data-theme="dark"]{
  --bg:#151312; --bg2:#1D1916; --card:#1A1715; --line:rgba(241,230,216,.13);
  --text:#F1E6D8; --muted:#B1A394; --gold:#CD8F51; --accent:#CD8F51; --accent-ink:#1C1410;
  --veil:rgba(21,19,18,.86); --hdr:rgba(21,19,18,.82); --logo:#567A60; --spark2:#8FB3A0; --ghost:rgba(241,230,216,.07);
  color-scheme:dark;
}
[data-theme="light"]{
  --bg:#F9F9F8; --bg2:#FFFFFF; --card:#FFFFFF; --line:#E7E5E4;
  --text:#1C1917; --muted:#78716C; --gold:#292524; --accent:#292524; --accent-ink:#FFFFFF;
  --veil:rgba(249,249,248,.9); --hdr:rgba(249,249,248,.88); --logo:#292524; --spark2:#78716C; --ghost:rgba(28,25,23,.06);
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%;scroll-padding-top:calc(76px + env(safe-area-inset-top,0px))}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:16px;line-height:1.65;-webkit-font-smoothing:antialiased;transition:background-color .35s,color .35s}
body.lock{overflow:hidden}
img,svg{max-width:100%}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,h3,h4{font-family:var(--serif);font-weight:400;margin:0;letter-spacing:-.005em;text-wrap:balance}
p{margin:0}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.wrap{width:100%;max-width:1180px;margin:0 auto;padding-inline:22px}
.eyebrow{font-size:.7rem;letter-spacing:.26em;text-transform:uppercase;color:var(--gold);font-weight:500}
.muted{color:var(--muted)}
.center{text-align:center}
.sec{padding:clamp(64px,9vw,112px) 0}
.sec.alt{background:var(--bg2)}
h2.t{font-size:clamp(2.1rem,6vw,3.3rem);line-height:1.1;margin-top:12px}
.lead{color:var(--muted);max-width:56ch;margin-top:16px;font-size:.98rem}
.center .lead{margin-inline:auto}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;min-height:50px;padding:0 26px;border-radius:999px;border:1px solid transparent;font-weight:500;font-size:.92rem;transition:background-color .2s,border-color .2s,color .2s,transform .2s}
.btn svg{width:17px;height:17px;flex:none}
.btn-cream{background:#F1E6D8;color:#1C1410}
.btn-cream:hover{background:#fff}
.btn-line{border-color:rgba(241,230,216,.4);color:#F1E6D8}
.btn-line:hover{border-color:#F1E6D8}
.btn-gold{background:var(--accent);color:var(--accent-ink)}
.btn-gold:hover{filter:brightness(1.1)}
.btn-out{border-color:var(--line);color:var(--text)}
.btn-out:hover{border-color:var(--text)}
.btn-sm{min-height:42px;padding:0 18px;font-size:.84rem}
.btn-block{width:100%}
.link-gold{display:inline-flex;align-items:center;gap:8px;color:var(--gold);font-weight:500;font-size:.9rem}
.link-gold svg{width:15px;height:15px}

/* header */
.top{position:fixed;top:0;left:0;right:0;z-index:50;padding-top:env(safe-area-inset-top,0px);color:#F1E6D8;background:linear-gradient(180deg,rgba(21,19,18,.6),transparent);transition:background-color .3s,color .3s,border-color .3s;border-bottom:1px solid transparent;--ibc:rgba(241,230,216,.28)}
.top.solid{background:var(--hdr);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);color:var(--text);border-bottom-color:var(--line);--ibc:var(--line)}
.bar{display:flex;align-items:center;gap:8px;height:64px}
.brand{display:flex;align-items:center;gap:8px;min-width:0;flex:1 1 auto;font-family:var(--serif);font-size:clamp(.98rem,4.1vw,1.3rem);white-space:nowrap;overflow:hidden}
.logo{width:32px;height:32px;border-radius:9px;background:var(--logo);display:grid;place-items:center;flex:none}
.logo svg{width:20px;height:20px}
.tools{margin-left:auto;display:flex;align-items:center;gap:6px;flex:none}
.ib{width:40px;height:40px;border-radius:50%;border:1px solid var(--ibc);background:transparent;display:grid;place-items:center;transition:border-color .2s}
.ib:hover{border-color:currentColor}
.ib svg{width:18px;height:18px}
.lang{display:inline-flex;border:1px solid var(--ibc);border-radius:999px;padding:3px}
.lang button{border:0;background:transparent;min-width:31px;height:32px;border-radius:999px;font-size:.74rem;font-weight:600;letter-spacing:.04em;opacity:.7;color:inherit;transition:background-color .2s,color .2s,opacity .2s}
.lang button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);opacity:1}
.dnav{display:none}
.burger{position:relative}
.burger i{position:absolute;left:12px;right:12px;height:1.6px;background:currentColor;transition:transform .25s,opacity .2s}
.burger i:nth-child(1){top:15px}.burger i:nth-child(2){top:20px}.burger i:nth-child(3){top:25px}
body.menu-open .burger i:nth-child(1){transform:translateY(5px) rotate(45deg)}
body.menu-open .burger i:nth-child(2){opacity:0}
body.menu-open .burger i:nth-child(3){transform:translateY(-5px) rotate(-45deg)}
.menu{position:fixed;inset:0;z-index:45;background:var(--bg);display:none;flex-direction:column;padding:calc(96px + env(safe-area-inset-top,0px)) 26px calc(28px + env(safe-area-inset-bottom,0px))}
body.menu-open .menu{display:flex}
.menu a.ml{font-family:var(--serif);font-size:2rem;padding:12px 0;border-bottom:1px solid var(--line)}
.menu a.ml:last-of-type{border-bottom:0}
@media(min-width:900px){
  .dnav{display:flex;gap:30px;margin-left:auto;margin-right:12px;font-size:.88rem}
  .dnav a{opacity:.8;transition:opacity .2s}.dnav a:hover{opacity:1}
  .burger{display:none}
  .tools{margin-left:0}
}

/* hero */
.hero{position:relative;min-height:100svh;display:grid;place-items:center;text-align:center;color:#F1E6D8;overflow:hidden;padding:130px 0 100px;background:#151312}
.slide{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0;transition:opacity 1.6s ease}
.slide.on{opacity:1;animation:kb 16s ease-out forwards}
@keyframes kb{from{transform:scale(1.02)}to{transform:scale(1.12)}}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(21,19,18,.62) 0%,rgba(21,19,18,.5) 45%,rgba(21,19,18,.9) 100%)}
.hero-in{position:relative;z-index:2;display:grid;gap:22px;justify-items:center}
.hero h1{font-size:clamp(2.6rem,8.4vw,5.2rem);line-height:1.04;max-width:15ch}
.hero-p{max-width:46ch;color:rgba(241,230,216,.82);font-size:1rem}
.hero-cta{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:8px}
.dots{position:absolute;z-index:2;bottom:34px;left:0;right:0;display:flex;justify-content:center;gap:8px}
.dots i{width:26px;height:2px;background:rgba(241,230,216,.3);transition:background-color .3s}
.dots i.on{background:var(--gold)}
@media(max-width:380px){.hero{padding-top:110px}}

/* about teaser */
.about-t{display:grid;gap:44px}
.checks{list-style:none;margin:22px 0 26px;padding:0;display:grid;gap:12px;color:var(--text);font-size:.95rem}
.checks li{display:flex;gap:12px;align-items:flex-start}
.checks svg{width:17px;height:17px;flex:none;margin-top:4px;color:var(--gold)}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}
.duo .ph{aspect-ratio:4/5;border-radius:22px;overflow:hidden;background:var(--bg2)}
.duo .ph:nth-child(2){margin-top:-28px}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
@media(min-width:900px){.about-t{grid-template-columns:1fr 1fr;gap:80px;align-items:center}}

/* quotes */
.quotes{position:relative;text-align:center;padding:clamp(70px,10vw,120px) 0}
.qmark{position:absolute;left:50%;top:44px;transform:translateX(-50%);font-family:var(--serif);font-size:11rem;line-height:1;color:var(--gold);opacity:.18;pointer-events:none}
.qbox{position:relative;min-height:230px;display:grid;align-content:center;justify-items:center;gap:18px;animation:fadeup .6s ease}
.qbox blockquote{margin:0;font-family:var(--serif);font-style:italic;font-size:clamp(1.6rem,4.6vw,2.5rem);line-height:1.25;max-width:26ch}
.qline{width:60px;height:1px;background:var(--gold)}
.qby{font-size:.78rem;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);font-weight:500}
.qrole{font-size:.88rem;color:var(--muted);margin-top:-8px}
.qdots{display:flex;gap:8px;justify-content:center;margin-top:30px}
.qdots button{width:38px;height:3px;border:0;padding:0;background:var(--line);border-radius:2px;position:relative}
.qdots button::before{content:"";position:absolute;inset:-14px 0}
.qdots button[aria-current="true"]{background:var(--gold)}
@keyframes fadeup{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* marquee */
.mq-sec{position:relative;padding:clamp(70px,10vw,110px) 0;overflow:hidden;background-size:cover;background-position:center}
.mq-sec::before{content:"";position:absolute;inset:0;background:var(--veil)}
.mq{position:relative;overflow:hidden;white-space:nowrap}
.mq-track{display:inline-flex;align-items:center;animation:mq 42s linear infinite;will-change:transform}
.mq.rev .mq-track{animation-direction:reverse;animation-duration:50s}
.mq-track span{display:inline-flex;align-items:center}
.mq-big{font-family:var(--serif);font-size:clamp(2.4rem,7vw,4.4rem);line-height:1.2;padding:0 .5em}
.mq-it{font-family:var(--serif);font-style:italic;font-size:clamp(1.5rem,4.4vw,2.6rem);color:var(--muted);padding:0 .6em;opacity:.9}
.sp{width:.5em;height:.5em;color:var(--gold);flex:none}
.sp2{width:.38em;height:.38em;color:var(--spark2);flex:none}
@keyframes mq{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.band{background:var(--accent);color:var(--accent-ink);overflow:hidden;white-space:nowrap;padding:16px 0}
.band .mq-track{animation-duration:36s}
.band .mq-big{font-size:clamp(1.3rem,3vw,1.7rem);padding:0 .9em}
.band .sp{color:var(--accent-ink);width:.7em;height:.7em}

/* rooms */
.tabs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:30px -22px 26px;padding:0 22px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;min-height:44px;padding:0 20px;border-radius:999px;border:1px solid var(--line);background:transparent;font-size:.88rem;transition:background-color .2s,color .2s,border-color .2s}
.tab[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:500}
.room{display:grid;grid-template-columns:minmax(0,1fr);gap:26px}
.room>*{min-width:0}
.stage{position:relative;border-radius:28px;overflow:hidden;aspect-ratio:4/5;background:var(--bg2);touch-action:pan-y}
.stage img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;animation:fadeup .5s ease}
.stage::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.05) 40%,rgba(10,8,7,.88) 100%);pointer-events:none}
.count{position:absolute;z-index:2;top:16px;right:16px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.74rem;padding:5px 12px;border-radius:999px;background:rgba(21,19,18,.7);color:#F1E6D8;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.stage-in{position:absolute;z-index:2;left:22px;right:22px;bottom:22px;color:#F1E6D8;display:grid;gap:8px}
.stage-in .eyebrow{color:#CD8F51}
.stage-in h3{font-size:clamp(1.9rem,5vw,2.5rem);line-height:1.05}
.stage-in .sprice{font-size:.95rem;color:#E8C9A4}
.ctrl{display:flex;align-items:center;gap:12px;margin-top:8px}
.ctrl button{width:42px;height:42px;border-radius:50%;border:1px solid rgba(241,230,216,.4);background:rgba(21,19,18,.35);color:#F1E6D8;display:grid;place-items:center;flex:none}
.ctrl button:hover{border-color:#F1E6D8}
.ctrl svg{width:17px;height:17px}
.seg{display:flex;gap:6px;flex:1}
.seg i{flex:1;height:3px;border-radius:2px;background:rgba(241,230,216,.28)}
.seg i.on{background:#CD8F51}
.rq{font-family:var(--serif);font-style:italic;font-size:1.5rem;line-height:1.3;color:var(--text)}
.mini{font-size:.7rem;letter-spacing:.24em;text-transform:uppercase;color:var(--muted)}
.thumbs{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;padding:16px 4px 6px;margin:0 -4px}
.thumbs::-webkit-scrollbar{display:none}
.th{position:relative;flex:none;width:104px;aspect-ratio:3/4;border-radius:14px;border:1px solid var(--line);padding:0;overflow:hidden;background:var(--bg2);filter:grayscale(1) brightness(.78);transition:filter .3s,border-color .3s,box-shadow .3s}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.th span{position:absolute;left:0;right:0;bottom:0;padding:16px 8px 7px;font-size:.66rem;line-height:1.25;text-align:left;color:#F1E6D8;background:linear-gradient(transparent,rgba(10,8,7,.85))}
.th[aria-pressed="true"]{filter:none;border:2px solid var(--gold);box-shadow:0 0 0 4px rgba(205,143,81,.16),0 10px 24px rgba(0,0,0,.35)}
.th[aria-pressed="true"]::before{content:attr(data-badge);position:absolute;z-index:2;top:6px;left:6px;font-size:.58rem;letter-spacing:.08em;font-weight:600;background:var(--gold);color:var(--accent-ink);padding:2px 7px;border-radius:6px}
.rinfo{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;align-content:start}
.rinfo>*{min-width:0}
.rinfo .rdesc{color:var(--muted);font-size:.97rem}
.spec{margin:0;display:grid}
.spec div{display:grid;gap:3px;padding:12px 0;border-top:1px solid var(--line)}
.spec dt{font-size:.68rem;letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}
.spec dd{margin:0;font-size:.95rem}
.acts{display:grid;gap:10px}
@media(min-width:900px){
  .room{grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:64px;align-items:start}
  .stage{aspect-ratio:4/4.6}
  .acts{grid-template-columns:1fr 1fr}
}

/* price / finish */
.price{font-weight:600;color:var(--gold);font-size:1.1rem;font-variant-numeric:tabular-nums}
.price-big{font-family:var(--serif);font-size:2.3rem;color:var(--gold);line-height:1}
.fin{display:grid;gap:10px}
.fin-l{font-size:.86rem;color:var(--muted)}
.fin-l b{color:var(--text);font-weight:500}
.sws{display:flex;flex-wrap:wrap;gap:8px}
.sw{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:transparent;padding:0;display:grid;place-items:center;transition:border-color .2s,box-shadow .2s}
.sw i{width:20px;height:20px;border-radius:50%;border:1px solid rgba(241,230,216,.25);display:block}
[data-theme="light"] .sw i{border-color:rgba(28,25,23,.2)}
.sw[aria-pressed="true"]{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
.fchips{display:flex;flex-wrap:wrap;gap:8px}
.fchip{display:inline-flex;align-items:center;gap:9px;min-height:44px;padding:0 14px 0 8px;border-radius:999px;border:1px solid var(--line);background:transparent;font-size:.86rem;transition:border-color .2s,box-shadow .2s}
.fchip i{width:26px;height:26px;border-radius:50%;border:1px solid rgba(241,230,216,.25)}
[data-theme="light"] .fchip i{border-color:rgba(28,25,23,.2)}
.fchip small{color:var(--muted);font-size:.72rem}
.fchip[aria-pressed="true"]{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
.note{font-size:.8rem;color:var(--muted)}

/* product cards */
.sec-head{display:flex;flex-direction:column;gap:18px;align-items:flex-start;margin-bottom:38px}
.grid{display:grid;grid-template-columns:1fr;gap:42px 22px}
@media(min-width:620px){.grid{grid-template-columns:repeat(2,1fr)}}
@media(min-width:960px){.grid{grid-template-columns:repeat(3,1fr);gap:56px 26px}}
.pc{display:flex;flex-direction:column;text-align:center}
.pc .im{display:block;aspect-ratio:4/5;border-radius:26px;overflow:hidden;background:var(--bg2)}
.pc .im img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .8s ease}
.pc .im:hover img{transform:scale(1.04)}
.pc .meta{display:grid;gap:5px;padding-top:18px;justify-items:center}
.pc .cat{font-size:.68rem;letter-spacing:.24em;text-transform:uppercase;color:var(--muted)}
.pc h3{font-size:1.65rem;line-height:1.15}
.pc .sws{justify-content:center;margin-top:8px}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:30px -22px 38px;padding:0 22px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:44px;padding:0 18px;border-radius:999px;border:1px solid var(--line);background:transparent;font-size:.88rem;display:inline-flex;align-items:center;gap:5px;transition:background-color .2s,color .2s,border-color .2s}
.chip sup{font-size:.62rem;opacity:.75;position:relative;top:-1px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:500}
@media(min-width:900px){.chips{justify-content:center;margin-inline:0;padding:0}}

/* project */
.proj{display:grid;gap:34px}
.pimg{position:relative;border-radius:28px;overflow:hidden;aspect-ratio:4/5;background:var(--bg2)}
.pimg img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pimg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,rgba(10,8,7,.88))}
.pimg-in{position:absolute;z-index:2;left:22px;right:22px;bottom:22px;display:grid;gap:16px;color:#F1E6D8}
.pimg-in p{font-family:var(--serif);font-size:1.7rem;line-height:1.2}
.pimg .btn-gold{background:#CD8F51;color:#1C1410}
@media(min-width:900px){.proj{grid-template-columns:1fr 1fr;gap:80px;align-items:center}.pimg{aspect-ratio:1/1}}

/* steps */
.steps{display:grid;gap:14px;margin-top:40px}
.step{position:relative;border:1px solid var(--line);border-radius:22px;padding:26px;overflow:hidden;display:grid;gap:8px;text-align:left}
.step .n{width:42px;height:42px;border-radius:50%;background:rgba(205,143,81,.14);color:var(--gold);display:grid;place-items:center;font-family:var(--serif);font-size:1.05rem;margin-bottom:10px}
[data-theme="light"] .step .n{background:#E7E5E4}
.step::after{content:attr(data-n);position:absolute;right:22px;top:6px;font-family:var(--serif);font-size:6rem;line-height:1;color:var(--ghost)}
.step h3{font-size:1.55rem}
.step p{color:var(--muted);font-size:.93rem;max-width:34ch}
@media(min-width:860px){.steps{grid-template-columns:repeat(3,1fr);gap:20px}}

/* faq */
.faq{margin-top:34px;border-bottom:1px solid var(--line);max-width:820px}
.faq details{border-top:1px solid var(--line)}
.faq summary{list-style:none;display:flex;justify-content:space-between;gap:20px;align-items:center;padding:20px 0;cursor:pointer;font-size:1.02rem;font-weight:500;transition:color .2s}
.faq summary::-webkit-details-marker{display:none}
.faq details[open] summary{color:var(--gold)}
.pm{width:15px;height:15px;position:relative;flex:none;transition:transform .3s}
.pm::before,.pm::after{content:"";position:absolute;left:0;right:0;top:50%;height:1.6px;background:currentColor;margin-top:-.8px}
.pm::after{transform:rotate(90deg)}
.faq details[open] .pm{transform:rotate(45deg)}
.faq details p{color:var(--muted);padding:0 0 22px;max-width:62ch;font-size:.95rem}

/* final cta */
.cta{position:relative;text-align:center;padding:clamp(90px,12vw,150px) 0;background-size:cover;background-position:center;overflow:hidden}
.cta::before{content:"";position:absolute;inset:0;background:rgba(21,19,18,.8)}
[data-theme="light"] .cta::before{background:rgba(249,249,248,.9)}
.cta .wrap{position:relative;display:grid;gap:18px;justify-items:center}
.cta h2{font-size:clamp(2.1rem,6vw,3.6rem);line-height:1.1;max-width:18ch}

/* page heads */
.page{padding-top:calc(130px + env(safe-area-inset-top,0px))}
.phead{text-align:center;display:grid;gap:14px;justify-items:center}
.phead h1{font-size:clamp(2.4rem,7vw,3.8rem);line-height:1.08}

.detail{display:grid;grid-template-columns:minmax(0,1fr);gap:30px}
.dimg{border-radius:28px;overflow:hidden;aspect-ratio:4/5;background:var(--bg2)}

.dinfo{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;align-content:start}
.dinfo h1{font-size:clamp(2.2rem,6vw,3.2rem);line-height:1.08}
.dinfo .dd{color:var(--muted);font-size:1rem}
.dinfo h3{font-size:1.6rem;margin-top:8px}
.srow{display:grid;grid-template-columns:7rem 1fr;gap:14px;padding:13px 0;border-top:1px solid var(--line);font-size:.93rem}
.srow:last-child{border-bottom:1px solid var(--line)}
.srow span:first-child{color:var(--muted)}
@media(min-width:900px){.detail{grid-template-columns:1fr 1fr;gap:72px;align-items:start}.dimg{position:sticky;top:96px}}
.cards3{display:grid;gap:14px;margin-top:34px}
.cc{border:1px solid var(--line);border-radius:22px;padding:28px;display:grid;gap:10px;justify-items:start}
.cc h3{font-size:1.6rem}
.cc p{color:var(--muted);font-size:.95rem}
.cc a.num{border-bottom:1px solid currentColor;font-size:1.05rem}

.row2{display:grid;gap:36px;margin-top:44px}

/* footer */
footer{border-top:1px solid var(--line);padding:60px 0 calc(40px + env(safe-area-inset-bottom,0px))}
.fg{display:grid;gap:36px}
.fg h4{font-size:1.3rem;margin-bottom:12px}
.fg ul{list-style:none;margin:0;padding:0;display:grid;gap:9px;color:var(--muted);font-size:.92rem}
.fg a:hover{color:var(--text)}
.fb p{color:var(--muted);font-size:.93rem;margin-top:14px;max-width:34ch}
.copy{margin-top:46px;padding-top:24px;border-top:1px solid var(--line);color:var(--muted);font-size:.82rem}

.fab{position:fixed;right:16px;bottom:calc(18px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:50%;background:var(--wa);display:grid;place-items:center;z-index:40;box-shadow:0 6px 20px rgba(0,0,0,.35)}

.view{animation:fadeup .45s ease}

function waLink(kind,p){
  const L=T[lang]; let m;
  if(kind==='ask') m=L.m_ask(p.name[lang],FIN[sel[p.id]][lang],rp(price(p)));
  else if(kind==='custom') m=L.m_custom(p.name[lang]);
  else if(kind==='project') m=L.m_project;
  else m=L.m_general;
  return `https://wa.me/${WA}?text=${encodeURIComponent(m)}`;
}

function fileToDataURL(file,max=1400,q=.82){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file), im=new Image();
    im.onload=()=>{
      let w=im.naturalWidth, h=im.naturalHeight; const s=Math.min(1,max/Math.max(w,h)); w=Math.max(1,Math.round(w*s)); h=Math.max(1,Math.round(h*s));
      const c=document.createElement('canvas'); c.width=w; c.height=h;
      const x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,w,h); x.drawImage(im,0,0,w,h);
      URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg',q));
    };
    im.onerror=()=>{ URL.revokeObjectURL(url); rej(new Error('bad image')); };
    im.src=url;
  });
}

async function handleFiles(id,mode,i,files){
  const arr=PHOTOS[id]; if(!arr) return;
  const room=MAXPH-arr.length;
  if(mode==='add'&&room<=0){ toast(t('e_max')); return; }
  const list=mode==='add'?files.slice(0,room):files.slice(0,1);
  toast(t('e_proc'));
  const out=[];
  for(const f of list){ try{ out.push(await fileToDataURL(f)); }catch(_){ } }
  if(!out.length){ toast(t('e_fail')); return; }
  if(mode==='add'){ const first=arr.length; arr.push(...out); if(gal.id===id) gal.i=first; }
  else if(mode==='replace'){ arr[Math.min(i,arr.length-1)]=out[0]; }
  else { arr[0]=out[0]; }
  afterPhotoChange(id);
  toast(mode==='add'?(out.length+' '+t('e_added')+(files.length>list.length?' · '+t('e_max'):'')):t('e_updated'));
}

/* ============ ROUTER ============ */
let lastKey = null;
function go(h,replace){
  ROUTE=h;
  try{ history[replace?'replaceState':'pushState'](null,'',h); }catch(_){ }
  render(false);
}
function currentRoute(){
  const parts=(ROUTE.replace(/^#/,'')||'/').split('/').filter(Boolean);
  return parts;
}
function render(keepScroll){
  timers.forEach(clearInterval); timers=[];
  const parts=currentRoute(), key=parts.join('/');
  if(parts[0]==='edit'){ edit=true; go('#/produk',true); return; }
  document.documentElement.lang=lang; document.title=t('title');
  document.body.setAttribute('data-theme',theme);
  let html, home=false;
  if(parts.length===0){ html=pageHome(); home=true; }
  else if(parts[0]==='produk' && parts[1] && byId[parts[1]]) html=pageDetail(byId[parts[1]]);
  else if(parts[0]==='kategori' && CATS.includes(parts[1])){ if(lastKey!==key) filter=parts[1]; html=pageCatalog(); }
  else if(parts[0]==='produk'){ if(lastKey!==key) filter='all'; html=pageCatalog(); }
  else if(parts[0]==='tentang') html=pageAbout();
  else if(parts[0]==='kontak') html=pageContact();
  else { html=pageHome(); home=true; }
  const y=window.scrollY;
  $('#app').innerHTML=html;
  renderHeader(); renderFooter(); renderEditBar();
  $('#top').classList.toggle('solid', !home || window.scrollY>40);
  if(home){ renderQuote(); renderRooms(); startHome(); }
  if(parts[0]==='produk' && parts[1] && byId[parts[1]]){ if(gal.id!==parts[1]||lastKey!==key){ gal.id=parts[1]; gal.i=0; } renderGallery(); }
  syncAll();
  if(!keepScroll || lastKey!==key){ window.scrollTo(0,0); }
  else window.scrollTo(0,y);
  lastKey=key;
  closeMenu();
}
function startHome(){
  const reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const slides=$$('.slide'), dots=$$('.dots i');
  if(!reduce){
    timers.push(setInterval(()=>{ hi=(hi+1)%slides.length; slides.forEach((s,i)=>s.classList.toggle('on',i===hi)); dots.forEach((d,i)=>d.classList.toggle('on',i===hi)); },6500));
    timers.push(setInterval(()=>{ qi=(qi+1)%(t('quotes').length||1); renderQuote(); },6500));
  }
}
function closeMenu(){ document.body.classList.remove('menu-open','lock'); const b=$('.burger'); if(b) b.setAttribute('aria-expanded','false'); }

/* ============ EVENT ============ */
document.addEventListener('click',e=>{
  const an=e.target.closest('a'); if(an && /^#/.test(an.getAttribute('href')||'') && !e.defaultPrevented && !e.metaKey && !e.ctrlKey){ e.preventDefault(); go(an.getAttribute('href')); return; }
  const ml=e.target.closest('.menu a'); if(ml){ closeMenu(); }
  if(e.target.closest('.copy')){ tapN++; clearTimeout(tapT); tapT=setTimeout(()=>{tapN=0},2500); if(false){ tapN=0; edit=!edit; render(true); toast(t(edit?'e_on':'e_off')); } }
  const b=e.target.closest('[data-act]'); if(!b) return;
  const a=b.dataset.act;
  if(a==='fin'){ sel[b.dataset.p]=b.dataset.f; refreshProduct(b.dataset.p); }
  else if(a==='lang'){ lang=b.dataset.v; try{localStorage.setItem('lrj-lang',lang)}catch(_){ } render(true); }
  else if(a==='theme'){ theme=theme==='dark'?'light':'dark'; try{localStorage.setItem('lrj-theme',theme)}catch(_){ } render(true); }
  else if(a==='menu'){ const o=document.body.classList.toggle('menu-open'); document.body.classList.toggle('lock',o); b.setAttribute('aria-expanded',String(o)); }
  else if(a==='filter'){ filter=b.dataset.v; const g=$('#catGrid'); $$('.chip').forEach(c=>c.setAttribute('aria-pressed',String(c.dataset.v===filter))); g.innerHTML=P.filter(p=>filter==='all'||p.cat===filter).map(card).join(''); syncAll(); }
  else if(a==='room'){ room.k=b.dataset.v; room.i=0; renderRooms(); syncAll(); }
  else if(a==='rpick'){ room.i=+b.dataset.i; renderRooms(); syncAll(); }
  else if(a==='rnext'||a==='rprev'){ const n=ROOMS[room.k].length; room.i=(room.i+(a==='rnext'?1:n-1))%n; renderRooms(); syncAll(); }
  else if(a==='qgo'){ qi=+b.dataset.i; renderQuote(); }
  else if(a==='gpick'){ gal.i=+b.dataset.i; renderGallery(); }
  else if(a==='gnext'||a==='gprev'){ const n=PHOTOS[gal.id].length; gal.i=(gal.i+(a==='gnext'?1:n-1))%n; renderGallery(); }
  else if(a==='pick'){ pickFiles(b.dataset.p,b.dataset.mode,+b.dataset.i||0); }
  else if(a==='mcover'){ const arr=PHOTOS[gal.id]; arr.unshift(arr.splice(gal.i,1)[0]); gal.i=0; afterPhotoChange(gal.id); }
  else if(a==='mmove'){ const arr=PHOTOS[gal.id], j=gal.i+(+b.dataset.d); if(j>=0&&j<arr.length){ [arr[gal.i],arr[j]]=[arr[j],arr[gal.i]]; gal.i=j; afterPhotoChange(gal.id); } }
  else if(a==='mdel'){ const arr=PHOTOS[gal.id]; if(arr.length>1&&confirm(t('e_del_q'))){ arr.splice(gal.i,1); gal.i=Math.min(gal.i,arr.length-1); afterPhotoChange(gal.id); } }
  else if(a==='edit-dl'){ exportHTML(); }
  else if(a==='edit-reset'){ if(confirm(t('e_reset_q'))){ loadPhotos(null); DB.del('photos').catch(()=>{}); gal.i=0; render(true); toast(t('e_reset_ok')); } }
  else if(a==='edit-done'){ edit=false; render(true); }
});
const syncRoute=()=>{ if(ROUTE===location.hash) return; ROUTE=location.hash; render(false); };
window.addEventListener('hashchange',syncRoute); window.addEventListener('popstate',syncRoute);
window.addEventListener('scroll',()=>{ const home=currentRoute().length===0; $('#top').classList.toggle('solid',!home||window.scrollY>40); },{passive:true});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape') closeMenu();
  if((e.key==='ArrowLeft'||e.key==='ArrowRight') && $('#gal') && gal.id && !/INPUT|TEXTAREA|SELECT/.test(e.target.tagName||'')){
    const n=PHOTOS[gal.id].length; if(n>1){ gal.i=(gal.i+(e.key==='ArrowRight'?1:n-1))%n; renderGallery(); }
  }
});

const SBC=(window.supabase&&window.CFG&&CFG.URL&&!/ISI-/.test(CFG.URL))?supabase.createClient(CFG.URL,CFG.KEY):null;
const rgb=h=>{h=(h||'#000').replace('#','');if(h.length===3)h=h.replace(/./g,'$&$&');return [0,2,4].map(i=>parseInt(h.substr(i,2),16)||0).join(',')};
function themeCss(S){let css='';
 for(const m of ['dark','light']){const g=k=>S[m+'_'+k];if(!g('bg'))continue;
  css+=`${m==='dark'?':root,':''}[data-theme="${m}"]{--bg:${g('bg')};--bg2:${g('bg2')};--card:${g('card')};--text:${g('text')};--muted:${g('muted')};--gold:${g('accent')};--accent:${g('accent')};--accent-ink:${g('accent_ink')};--logo:${g('logo')};--spark2:${g('spark')};--line:rgba(${rgb(g('text'))},.13);--ghost:rgba(${rgb(g('text'))},.07);--veil:rgba(${rgb(g('bg'))},.88);--hdr:rgba(${rgb(g('bg'))},.85)}`}
 for(const [k,v,fb] of [['serif','--serif','Georgia,serif'],['sans','--sans','system-ui,sans-serif']]){const f=S['font_'+k];if(f){css+=`:root{${v}:"${f}",${fb}}`;const l=document.createElement('link');l.rel='stylesheet';l.href='https://fonts.googleapis.com/css2?family='+encodeURIComponent(f).replace(/%20/g,'+')+':wght@400;500;600&display=swap';document.head.appendChild(l)}}
 let el=document.getElementById('themeCss');if(!el){el=document.createElement('style');el.id='themeCss';document.head.appendChild(el)}el.textContent=css}
function applyData(d){
 const S=Object.fromEntries(d.settings.map(r=>[r.key,r.value])),g=(k,x)=>S[k]||x,L=k=>(S[k]||'').split(',').map(x=>x.trim()).filter(Boolean);
 WA=g('wa',WA);BRAND=g('brand',BRAND);WAD=g('wa_display',WAD);IGU=g('instagram_url',IGU);IGT=g('instagram_text',IGT);TTU=g('tiktok_url',TTU);TTT=g('tiktok_text',TTT);ADDR=g('address',ADDR);BGM=g('bg_marquee',BGM);BGC=g('bg_cta',BGC);if(L('hero_slides').length)HERO=L('hero_slides');
 d.texts.forEach(r=>{for(const l of ['id','en']){const v=r[l];if(v==null)continue;T[l][r.key]=(r.key==='m_ask'||r.key==='m_custom')?(n,f,p)=>String(v).split('{n}').join(n).split('{f}').join(f).split('{p}').join(p):v}});
 if(d.finishes.length)FIN=Object.fromEntries(d.finishes.map(f=>[f.key,{id:f.nama,en:f.nama_en||f.nama,hex:f.hex,extra:f.extra||0}]));
 if(d.categories.length){CATS=d.categories.map(c=>c.slug);CATN=Object.fromEntries(d.categories.map(c=>[c.slug,{id:c.nama,en:c.nama_en||c.nama,s:{id:c.single||c.nama,en:c.single_en||c.nama_en||c.nama}}]))}
 if(d.products.length){P=d.products.map(r=>({id:r.id,cat:r.kategori,price:r.harga||0,fin:(r.finishes||[]).filter(k=>FIN[k]),name:{id:r.nama,en:r.nama_en||r.nama},desc:{id:r.deskripsi||'',en:r.deskripsi_en||r.deskripsi||''},mat:{id:r.bahan||'',en:r.bahan_en||r.bahan||''},size:r.ukuran||'',color:{id:r.warna||'',en:r.warna_en||r.warna||''}}));
  byId=Object.fromEntries(P.map(p=>[p.id,p]));sel=Object.fromEntries(P.map(p=>[p.id,p.fin[0]||Object.keys(FIN)[0]]));d.products.forEach(r=>{DEFAULT_PHOTOS[r.id]=r.foto||[]});
  FEATURED=d.products.filter(r=>r.unggulan).map(r=>r.id);
  const R={};(S.rooms||'').split('\n').forEach(l=>{const i=l.indexOf(':');if(i>0){const ids=l.slice(i+1).split(',').map(x=>x.trim()).filter(x=>byId[x]);if(ids.length)R[l.slice(0,i).trim()]=ids}});
  if(Object.keys(R).length){ROOMS=R;ROOM_KEYS=Object.keys(R);if(!R[room.k])room.k=ROOM_KEYS[0]}}
 try{if(!localStorage.getItem('lrj-theme')&&S.default_theme)theme=S.default_theme}catch(e){}
 themeCss(S);loadPhotos(null)}
async function boot(){
 if(SBC){try{const q=t=>SBC.from(t).select('*'),[a,b,c,e,f]=await Promise.all([q('settings'),q('texts'),q('finishes').order('urutan'),q('categories').eq('tampil',true).order('urutan'),q('products').eq('tampil',true).order('urutan')]);
  if(!a.error&&!f.error)applyData({settings:a.data,texts:b.data,finishes:c.data,categories:e.data,products:f.data});else console.warn(a.error||f.error)}catch(x){console.warn(x)}}
 render(false)}
boot();
