<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lini Rumah Jepara — Katalog Produk Furnitur</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --primary: #d97706;
      --wa-btn: #22c55e;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg);
      color: var(--text);
      padding: 16px;
      min-height: 100vh;
    }

    .container { max-width: 1200px; margin: 0 auto; }

    header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      padding: 16px 0 24px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 24px;
    }
    .brand h1 {
      font-size: 1.5rem;
      font-weight: 800;
      color: #fbbf24;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .brand p { font-size: 0.85rem; color: var(--muted); margin-top: 4px; }

    .btn-refresh {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 16px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-refresh:hover { background: var(--border); }

    .controls { display: flex; flex-direction: column; gap: 16px; margin-bottom: 28px; }
    .search-input {
      width: 100%;
      padding: 12px 16px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: #fff;
      font-size: 0.95rem;
    }
    .search-input:focus { outline: none; border-color: var(--primary); }

    .category-tabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; }
    .category-tabs::-webkit-scrollbar { height: 4px; }
    .category-tabs::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    .tab-btn {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
    }
    .tab-btn.active, .tab-btn:hover {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
    }
    .product-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .slider-wrap {
      width: 100%;
      height: 220px;
      background: #0b1120;
      position: relative;
      overflow: hidden;
    }
    .slider-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      cursor: pointer;
      display: block;
    }
    .no-img {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
      color: var(--muted);
    }
    .badge-cat {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid var(--border);
      color: #fbbf24;
      font-size: 0.72rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 6px;
      text-transform: uppercase;
      z-index: 2;
    }

    .slide-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(15, 23, 42, 0.75);
      border: 1px solid var(--border);
      color: #fff;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
      font-weight: bold;
      z-index: 3;
      user-select: none;
    }
    .slide-btn:hover { background: rgba(0, 0, 0, 0.9); }
    .slide-prev { left: 8px; }
    .slide-next { right: 8px; }

    .slide-counter {
      position: absolute;
      bottom: 8px;
      right: 8px;
      background: rgba(15, 23, 42, 0.85);
      padding: 2px 7px;
      border-radius: 10px;
      font-size: 0.7rem;
      color: #fff;
      font-weight: 600;
      z-index: 2;
    }

    .product-body {
      padding: 16px;
      display: flex;
      flex-direction: column;
      flex: 1;
    }
    .product-name {
      font-size: 1.05rem;
      font-weight: 700;
      margin-bottom: 6px;
      color: #fff;
    }
    .product-desc {
      font-size: 0.85rem;
      color: var(--muted);
      line-height: 1.4;
      margin-bottom: 14px;
      flex: 1;
    }
    .product-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding-top: 12px;
      border-top: 1px solid rgba(255,255,255,0.06);
    }
    .product-price {
      font-size: 0.95rem;
      font-weight: 700;
      color: #38bdf8;
    }
    .btn-wa {
      background: var(--wa-btn);
      color: #fff;
      text-decoration: none;
      font-size: 0.8rem;
      font-weight: 700;
      padding: 8px 12px;
      border-radius: 6px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .modal-zoom {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.88);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .modal-zoom img { max-width: 95%; max-height: 85vh; border-radius: 8px; }
    .modal-close {
      position: absolute;
      top: 20px;
      right: 25px;
      font-size: 2rem;
      color: #fff;
      cursor: pointer;
    }
    #loading { text-align: center; padding: 40px; color: var(--muted); }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="brand">
        <h1>🛋️ Lini Rumah Jepara</h1>
        <p>Katalog Koleksi Furnitur & Mebel Kayu Solid</p>
      </div>
      <button class="btn-refresh" onclick="fetchCatalog()">🔄 Segarkan Data</button>
    </header>

    <div class="controls">
      <input type="text" id="searchInput" class="search-input" placeholder="Cari produk, kategori, atau spesifikasi..." oninput="filterAndRender()">
      <div class="category-tabs" id="categoryTabs"></div>
    </div>

    <div id="loading">Memuat katalog dari Google Sheets...</div>
    <div id="productGrid" class="product-grid"></div>
  </div>

  <div class="modal-zoom" id="modalZoom" onclick="closeZoom()">
    <span class="modal-close">&times;</span>
    <img id="zoomImg" src="" alt="Detail Produk">
  </div>

  <script>
    // MASUKKAN LINK CSV SHEET KATALOG DI SINI:
    const KATALOG_SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSvwi7Zrze4f0LmvlMAVnG40msfXAm3PjbO1fS7OgjL7lqCQ55zaEZL6VeK-imYviC37wMgysBdMJs_/pub?output=csv";

    // NOMOR WA ADMIN KATALOG:
    const NO_WHATSAPP = "6282133030062";

    let allProducts = [];
    let selectedCategory = "Semua";

    async function fetchCatalog() {
      const loader = document.getElementById('loading');
      loader.style.display = 'block';

      try {
        if (!KATALOG_SHEET_CSV_URL.includes("TEMPEL_LINK")) {
          const res = await fetch(KATALOG_SHEET_CSV_URL + '&_t=' + new Date().getTime());
          const text = await res.text();
          allProducts = parseCatalogCSV(text);
          setupCategories();
        }
      } catch (err) {
        console.error("Gagal memuat:", err);
      }

      loader.style.display = 'none';
      filterAndRender();
    }

    function parseCatalogCSV(text) {
      const lines = text.trim().split('\n');
      const list = [];

      for (let i = 1; i < lines.length; i++) {
        const col = lines[i].split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(c => c.trim().replace(/^"\vert{}"$/g, ''));
        
        if (col.length >= 2 && col[1]) {
          const rawPhotos = col[4] || "";
          const photoArray = rawPhotos.split(',').map(p => p.trim()).filter(Boolean);

          list.push({
            id: i,
            category: col[0] || "Lainnya",
            name: col[1] || "Produk Furnitur",
            desc: col[2] || "-",
            price: col[3] || "Hubungi Kami",
            photos: photoArray,
            currentSlide: 0
          });
        }
      }
      return list;
    }

    function setupCategories() {
      const tabsContainer = document.getElementById('categoryTabs');
      const categories = ["Semua", ...new Set(allProducts.map(p => p.category).filter(Boolean))];

      tabsContainer.innerHTML = categories.map(cat => `
        <button class="tab-btn ${cat === selectedCategory ? 'active' : ''}" onclick="selectCategory('${cat}')">
          ${cat}
        </button>
      `).join('');
    }

    function selectCategory(cat) {
      selectedCategory = cat;
      setupCategories();
      filterAndRender();
    }

    function filterAndRender() {
      const search = document.getElementById('searchInput').value.toLowerCase();
      const grid = document.getElementById('productGrid');
      grid.innerHTML = '';

      const filtered = allProducts.filter(item => {
        const matchSearch = item.name.toLowerCase().includes(search) || 
                            item.desc.toLowerCase().includes(search) ||
                            item.category.toLowerCase().includes(search);
        const matchCat = (selectedCategory === "Semua") || (item.category === selectedCategory);
        return matchSearch && matchCat;
      });

      if (filtered.length === 0) {
        grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; padding: 40px; color: var(--muted);">Tidak ada produk yang cocok.</div>';
        return;
      }

      grid.innerHTML = filtered.map(item => {
        const pesanWA = encodeURIComponent(`Halo Lini Rumah Jepara, saya tertarik dengan produk "${item.name}".`);
        const linkWA = `https://wa.me/${NO_WHATSAPP}?text=${pesanWA}`;
        const hasMultiple = item.photos.length > 1;
        const currentSrc = item.photos[item.currentSlide] || "";

        return `
          <div class="product-card" id="card-${item.id}">
            <div class="slider-wrap">
              <span class="badge-cat">${item.category}</span>
              
              ${item.photos.length > 0 
                ? `<img src="${currentSrc}" alt="${item.name}" class="slider-img" onclick="openZoom('${currentSrc}')" id="img-${item.id}">` 
                : `<div class="no-img">📷 Foto belum ada</div>`
              }

              ${hasMultiple ? `
                <button class="slide-btn slide-prev" onclick="changeSlide(${item.id}, -1)">❮</button>
                <button class="slide-btn slide-next" onclick="changeSlide(${item.id}, 1)">❯</button>
                <div class="slide-counter" id="counter-${item.id}">${item.currentSlide + 1}/${item.photos.length}</div>
              ` : ''}
            </div>

            <div class="product-body">
              <h3 class="product-name">${item.name}</h3>
              <p class="product-desc">${item.desc}</p>
              <div class="product-footer">
                <span class="product-price">${item.price}</span>
                <a href="${linkWA}" target="_blank" class="btn-wa">💬 Tanya WA</a>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    function changeSlide(productId, step) {
      const product = allProducts.find(p => p.id === productId);
      if (!product || product.photos.length <= 1) return;

      product.currentSlide = (product.currentSlide + step + product.photos.length) % product.photos.length;
      
      const imgEl = document.getElementById(`img-${productId}`);
      const counterEl = document.getElementById(`counter-${productId}`);
      
      if (imgEl) {
        imgEl.src = product.photos[product.currentSlide];
        imgEl.setAttribute('onclick', `openZoom('${product.photos[product.currentSlide]}')`);
      }
      if (counterEl) {
        counterEl.innerText = `${product.currentSlide + 1}/${product.photos.length}`;
      }
    }

    function openZoom(src) {
      if (!src) return;
      document.getElementById('zoomImg').src = src;
      document.getElementById('modalZoom').style.display = 'flex';
    }

    function closeZoom() {
      document.getElementById('modalZoom').style.display = 'none';
    }

    window.addEventListener('DOMContentLoaded', fetchCatalog);
  </script>
</body>
</html>
