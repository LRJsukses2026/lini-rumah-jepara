<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>Lini Rumah Jepara - Katalog Online</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --serif:"Cormorant Garamond","Iowan Old Style","Palatino Linotype",Georgia,serif;
  --sans:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --wa:#25D366;
}
:root,[data-theme="dark"]{
  --bg:#151312; --bg2:#1D1916; --card:#1A1715; --line:rgba(241,230,216,.13);
  --text:#F1E6D8; --muted:#B1A394; --gold:#CD8F51; --accent:#CD8F51; --accent-ink:#1C1410;
  --veil:rgba(21,19,18,.86); --hdr:rgba(21,19,18,.82); --logo:#567A60; --ghost:rgba(241,230,216,.07);
  color-scheme:dark;
}
[data-theme="light"]{
  --bg:#F9F9F8; --bg2:#FFFFFF; --card:#FFFFFF; --line:#E7E5E4;
  --text:#1C1917; --muted:#78716C; --gold:#292524; --accent:#292524; --accent-ink:#FFFFFF;
  --veil:rgba(249,249,248,.9); --hdr:rgba(249,249,248,.88); --logo:#292524; --ghost:rgba(28,25,23,.06);
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:16px;line-height:1.65;transition:background-color .35s,color .35s}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,h3{font-family:var(--serif);font-weight:400;margin:0}

.wrap{width:100%;max-width:1180px;margin:0 auto;padding-inline:22px}
.sec{padding:60px 0}
.center{text-align:center}
.eyebrow{font-size:.7rem;letter-spacing:.26em;text-transform:uppercase;color:var(--gold);font-weight:500}
h2.t{font-size:clamp(2.1rem,6vw,3.3rem);line-height:1.1;margin-top:8px}

/* Header & Nav */
.top{position:sticky;top:0;z-index:50;background:var(--hdr);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;justify-content:space-between;height:64px}
.brand{font-family:var(--serif);font-size:1.4rem;font-weight:600}

/* Filter Chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:12px;margin-bottom:24px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 20px;border-radius:999px;border:1px solid var(--line);background:transparent;font-size:.88rem;cursor:pointer}
.chip.active{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:500}

/* Product Grid */
.grid{display:grid;grid-template-columns:1fr;gap:36px 22px}
@media(min-width:620px){.grid{grid-template-columns:repeat(2,1fr)}}
@media(min-width:960px){.grid{grid-template-columns:repeat(3,1fr)}}

/* Card Product with Gallery Slider */
.pc{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:24px;overflow:hidden}
.slider{position:relative;aspect-ratio:4/5;background:var(--bg2);overflow:hidden}
.slides{display:flex;width:100%;height:100%;transition:transform .4s ease-in-out}
.slides img{width:100%;height:100%;object-fit:cover;flex:none}
.slide-btn{position:absolute;top:50%;transform:translateY(-50%);width:36px;height:36px;border-radius:50%;background:rgba(0,0,0,.5);color:#fff;border:none;display:grid;place-items:center;z-index:2;cursor:pointer}
.slide-btn.prev{left:10px}
.slide-btn.next{right:10px}
.dots{position:absolute;bottom:12px;left:0;right:0;display:flex;justify-content:center;gap:6px;z-index:2}
.dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.4);transition:background .3s}
.dot.active{background:var(--gold)}

.pc .meta{padding:20px;display:grid;gap:8px;text-align:center}
.pc .cat{font-size:.7rem;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.pc h3{font-size:1.5rem}
.pc .desc{font-size:.88rem;color:var(--muted)}
.pc .price{font-weight:600;color:var(--gold);font-size:1.15rem;margin-top:4px}
.btn-wa{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--accent);color:var(--accent-ink);padding:10px 20px;border-radius:999px;font-weight:500;margin-top:8px;font-size:.9rem}

/* Loading & Empty State */
.loading{text-align:center;padding:40px;color:var(--muted);font-size:1.1rem}
</style>
</head>
<body>

<header class="top">
  <div class="wrap bar">
    <div class="brand">Lini Rumah Jepara</div>
  </div>
</header>

<main class="wrap sec">
  <div class="center" style="margin-bottom: 32px;">
    <span class="eyebrow">Katalog Koleksi</span>
    <h2 class="t">Mebel & Furnitur Terpilih</h2>
  </div>

  <!-- Filter Kategori -->
  <div class="chips" id="categoryChips">
    <button class="chip active" onclick="filterCategory('semua', this)">Semua</button>
  </div>

  <!-- Container Produk -->
  <div class="grid" id="productGrid">
    <div class="loading">Memuat produk dari Spreadsheet...</div>
  </div>
</main>

<script>
// ==========================================
// 1. PENGATURAN GOOGLE SHEETS
// ==========================================
// Masukkan ID Spreadsheet Anda di bawah ini:
const SHEET_ID = "1LyxKjzHYFY_2f75Ge3g8KS4u3NnbeRaaTFawwQ5QIAc";
const WA_NUMBER = "6282133030062"; // Nomor WhatsApp Anda (Format Internasional tanpa +)

const SHEET_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json`;

let allProducts = [];

// ==========================================
// 2. FUNGSI AMBIL DATA SHEET
// ==========================================
async function fetchSheetData() {
  try {
    const res = await fetch(SHEET_URL);
    const text = await res.text();
    
    // Parsing JSON dari format response Google Visualization API
    const json = JSON.parse(text.substring(47, text.length - 2));
    const rows = json.table.rows;

    allProducts = rows.map((row, index) => {
      const c = row.c;
      // Memisahkan URL foto berdasarkan koma
      const photos = c[2]?.v ? c[2].v.split(',').map(url => url.trim()) : [];
      
      return {
        id: index,
        nama: c[0]?.v || "Tanpa Nama",
        kategori: c[1]?.v || "Lainnya",
        foto: photos,
        harga: c[3]?.v || "Hubungi Kami",
        deskripsi: c[4]?.v || ""
      };
    });

    renderCategories();
    renderProducts(allProducts);
  } catch (err) {
    console.error("Gagal mengambil data:", err);
    document.getElementById("productGrid").innerHTML = 
      `<div class="loading" style="color:#e5806f;">Gagal memuat data produk. Pastikan ID Spreadsheet sudah benar dan akses file disetel ke 'Siapa saja yang memiliki link'.</div>`;
  }
}

// ==========================================
// 3. FUNGSI RENDER KATEGORI
// ==========================================
function renderCategories() {
  const categories = ["semua", ...new Set(allProducts.map(p => p.kategori))];
  const chipsContainer = document.getElementById("categoryChips");
  
  chipsContainer.innerHTML = categories.map(cat => `
    <button class="chip ${cat === 'semua' ? 'active' : ''}" onclick="filterCategory('${cat}', this)">
      ${cat.charAt(0).toUpperCase() + cat.slice(1)}
    </button>
  `).join('');
}

function filterCategory(cat, btn) {
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
  btn.classList.add('active');

  if (cat === 'semua') {
    renderProducts(allProducts);
  } else {
    const filtered = allProducts.filter(p => p.kategori === cat);
    renderProducts(filtered);
  }
}

// ==========================================
// 4. FUNGSI RENDER PRODUK & SLIDER FOTO
// ==========================================
function renderProducts(products) {
  const container = document.getElementById("productGrid");
  
  if (products.length === 0) {
    container.innerHTML = `<div class="loading">Tidak ada produk ditemukan.</div>`;
    return;
  }

  container.innerHTML = products.map(p => {
    // Generate Slide Gambar
    const slideImgs = p.foto.map(url => `<img src="${url}" alt="${p.nama}">`).join('');
    
    // Generate Dots Indicator
    const dots = p.foto.length > 1 ? 
      `<div class="dots">${p.foto.map((_, i) => `<span class="dot ${i === 0 ? 'active' : ''}"></span>`).join('')}</div>` : '';

    // Tombol Navigasi Slider (jika foto > 1)
    const navBtns = p.foto.length > 1 ? `
      <button class="slide-btn prev" onclick="moveSlide(${p.id}, -1)">&#10094;</button>
      <button class="slide-btn next" onclick="moveSlide(${p.id}, 1)">&#10095;</button>
    ` : '';

    const waText = encodeURIComponent(`Halo, saya tertarik dengan produk: ${p.nama}`);

    return `
      <div class="pc" id="product-${p.id}">
        <div class="slider">
          <div class="slides" id="slides-${p.id}">
            ${slideImgs}
          </div>
          ${navBtns}
          ${dots}
        </div>
        <div class="meta">
          <span class="cat">${p.kategori}</span>
          <h3>${p.nama}</h3>
          <p class="desc">${p.deskripsi}</p>
          <div class="price">${p.harga}</div>
          <a href="https://wa.me/${WA_NUMBER}?text=${waText}" target="_blank" class="btn-wa">Tanya Via WhatsApp</a>
        </div>
      </div>
    `;
  }).join('');
}

// ==========================================
// 5. LOGIKA SLIDER BEBERAPA FOTO
// ==========================================
const slideIndexes = {};

function moveSlide(productId, direction) {
  if (!(productId in slideIndexes)) slideIndexes[productId] = 0;
  
  const product = allProducts.find(p => p.id === productId);
  const totalSlides = product.foto.length;
  
  slideIndexes[productId] += direction;

  if (slideIndexes[productId] >= totalSlides) slideIndexes[productId] = 0;
  if (slideIndexes[productId] < 0) slideIndexes[productId] = totalSlides - 1;

  const slidesEl = document.getElementById(`slides-${productId}`);
  const cardEl = document.getElementById(`product-${productId}`);
  const dots = cardEl.querySelectorAll('.dot');

  // Pergeseran slide
  slidesEl.style.transform = `translateX(-${slideIndexes[productId] * 100}%)`;

  // Update indikator titik
  dots.forEach((dot, idx) => {
    dot.classList.toggle('active', idx === slideIndexes[productId]);
  });
}

// Jalankan saat halaman dibuka
fetchSheetData();
</script>
</body>
</html>
