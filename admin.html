<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Admin Katalog</title>
<style>body{margin:0 auto;max-width:780px;padding:16px;font-family:system-ui,sans-serif;background:#151312;color:#f1e6d8}
input,textarea,select{width:100%;padding:10px;margin:4px 0 12px;border-radius:10px;border:1px solid #444;background:#1d1916;color:inherit;font:inherit}input[type=color]{height:44px;padding:2px}
button{font:inherit;padding:8px 14px;border-radius:99px;border:1px solid #555;background:#1d1916;color:inherit;cursor:pointer}.on{background:#cd8f51;color:#1c1410;border-color:#cd8f51}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px;border-bottom:1px solid #333}label{font-size:.8rem;color:#b1a394}small{color:#b1a394}
